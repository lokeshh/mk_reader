# Netlify Configuration for Mokṣopāya Reader SPA
# Zero-build static deployment

[build]
  # Publish the repository root containing index.html, style.css, app.js, mk_data.txt
  publish = "."
  # Overrides old "npm run build" setting in Netlify UI
  command = "echo 'Deploying static SPA...'"

# HTML entry points: Always revalidate so browsers immediately receive updates
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS and JS: Revalidate with Netlify ETags (fast 304 if unchanged, instant download if changed)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sacred text data: Revalidate with Netlify ETags (fast 304 if unchanged, fresh download if updated)
[[headers]]
  for = "/mk_data.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/plain; charset=utf-8"

# Font files: Long-term cache for performance
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "font/ttf"
