# Netlify Configuration for Mokṣopāya Reader SPA
# Zero-build static deployment

[build]
  # Publish the repository root containing index.html, style.css, app.js, mk_data.txt
  publish = "."
  # Overrides old "npm run build" setting in Netlify UI
  command = "echo 'Deploying static SPA...'"

# Cache header for the 7.8MB sacred text file for fast CDN delivery
[[headers]]
  for = "/mk_data.txt"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/plain; charset=utf-8"

# Cache header for CSS and JS
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
